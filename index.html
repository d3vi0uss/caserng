<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b12">
  <meta name="description" content="A client-side Counter-Strike-inspired skin RNG and collection simulator.">
  <title>DropLab — Skin RNG Simulator</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand-lockup">
        <div class="brand-mark">D<span>•</span></div>
        <div><div class="brand-name">DROPLAB</div><div class="brand-sub">SKIN RNG SIMULATOR</div></div>
      </div>
      <div class="sidebar-label">WORKSPACE</div>
      <nav class="nav-list" id="mainNav">
        <button class="nav-item active" data-page="dashboard"><span class="nav-icon">◈</span><span>Roll</span><kbd>01</kbd></button>
        <button class="nav-item" data-page="inventory"><span class="nav-icon">▦</span><span>Inventory</span><kbd>02</kbd></button>
        <button class="nav-item" data-page="equipment"><span class="nav-icon">⌑</span><span>Loadout</span><kbd>03</kbd></button>
        <button class="nav-item" data-page="collection"><span class="nav-icon">▤</span><span>Collection</span><kbd>04</kbd></button>
        <button class="nav-item" data-page="upgrades"><span class="nav-icon">↗</span><span>Upgrades</span><kbd>05</kbd></button>
        <button class="nav-item" data-page="market"><span class="nav-icon">⌁</span><span>Market</span><kbd>06</kbd></button>
      </nav>
      <div class="sidebar-label secondary-label">PROGRESSION</div>
      <nav class="nav-list">
        <button class="nav-item" data-page="quests"><span class="nav-icon">✧</span><span>Quests & Awards</span></button>
        <button class="nav-item" data-page="events"><span class="nav-icon">◉</span><span>Live Events</span><span class="live-dot"></span></button>
        <button class="nav-item" data-page="stats"><span class="nav-icon">▥</span><span>Statistics</span></button>
      </nav>
      <div class="sidebar-bottom">
        <div class="sidebar-event" id="sidebarEvent">
          <div class="event-mini-top"><span class="live-dot"></span> ACTIVE EVENT</div>
          <strong>Loading event…</strong><span class="muted">Event bonuses update your odds.</span>
        </div>
        <button class="nav-item settings-nav" data-action="settings"><span class="nav-icon">⚙</span><span>Settings & Saves</span></button>
        <div class="profile-row"><div class="avatar">D</div><div class="profile-copy"><strong>Collector</strong><span>LOCAL PROFILE</span></div><span class="local-pill">OFFLINE</span></div>
      </div>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <div class="topbar-left"><button class="mobile-menu" id="mobileMenu" aria-label="Open navigation">☰</button><div class="breadcrumb"><span>DROP LAB</span><b>/</b><strong id="pageName">ROLL</strong></div></div>
        <div class="topbar-right">
          <div class="top-stat"><span class="top-stat-label">BALANCE</span><strong id="topMoney">$0.00</strong></div>
          <div class="top-stat"><span class="top-stat-label">ROLLS</span><strong id="topRolls">0</strong></div>
          <div class="top-stat income-top"><span class="top-stat-label">INCOME / SEC</span><strong id="topIncome">$0.00</strong></div>
          <button class="icon-button" data-action="settings" aria-label="Settings">⚙</button>
        </div>
      </header>
      <div class="content-wrap"><div id="pageContent"></div></div>
      <footer class="footer"><span>DROP LAB <b>•</b> CLIENT-SIDE SIMULATOR</span><span>NO ACCOUNTS · NO API · YOUR SAVE STAYS IN THIS BROWSER</span></footer>
    </main>
  </div>
  <div id="modalRoot"></div>
  <div class="toast-stack" id="toastStack" aria-live="polite"></div>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
